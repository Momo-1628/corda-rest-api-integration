# ---------- Common settings for every webserver instance ----------
spring.application.name=corda-rest-api
server.port=10050

# Corda RPC connection (overridden by the seller/buyer profiles or --config.rpc.* args)
config.rpc.host=localhost
config.rpc.port=10006
config.rpc.username=sellerUser
config.rpc.password=sellerPass

# Security: every /api/** call except /api/health needs this value in the X-API-KEY header
api.security.key=seller-secret-key-123
api.security.header=X-API-KEY

# CORS (comma separated); * allows any origin, e.g. a local React/Angular dashboard
api.cors.allowed-origins=*

# Max time the API waits for a flow to finish
api.flow.timeout-seconds=60

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
